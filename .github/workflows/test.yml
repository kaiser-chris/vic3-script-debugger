name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # IntelliJ IDEA 2026.3 needs Java 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and the IntelliJ Platform download, and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      # Tests tagged "live" need a running game and are excluded unless -Plive is given.
      - run: ./gradlew test --console=plain

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
